# Pill links shown under the intro on the home page, rendered by
# _includes/quicklinks.liquid.
#
# An entry with an empty `url` renders as a greyed-out placeholder that holds
# its spot in the row — fill the url in and it becomes a live link.
#
# `icon` is a Font Awesome 7 or Academicons class. `glyph` is text shown in
# place of an icon, for marks Font Awesome has no icon for.

- label: CV
  icon: fa-regular fa-file-lines
  # A July 2026 PDF already sits at /assets/pdf/CV_Shijie_Zhou.pdf — point this
  # at it, or at whatever newer file gets dropped in, to activate the button.
  url: ""

- label: Google Scholar
  icon: ai ai-google-scholar
  url: https://scholar.google.com/citations?user=hfjfsC8AAAAJ

- label: GitHub
  icon: fa-brands fa-github
  url: https://github.com/JerryPlain

- label: LinkedIn
  icon: fa-brands fa-linkedin
  url: https://www.linkedin.com/in/jerryzhou11

# RedNote opens a QR card image rather than a profile page — the pattern
# tx-leo.github.io uses for that network.
- label: RedNote
  glyph: 小红书
  url: /assets/img/rednote.jpg

- label: Twitter
  icon: fa-brands fa-x-twitter
  url: https://x.com/jerryplain05
