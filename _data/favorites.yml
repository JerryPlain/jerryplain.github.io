# Playlist & Watchlist (/playlist-and-watchlist/): one entry per year, newest first.
#
# Per year:
#   year      the tab label (tabs only appear once there are two years)
#   note      optional: a line or two about the year, shown beside it
#   playlist  optional: { label: Spotify, url: ... }, a "listen to the whole year" link
#   songs     title, artist, genre (a key from `genres`); optional:
#               cover  a square image under assets/img/favorites/<year>/ (360px is plenty)
#               tone   a hue 0-360 for the stand-in tile when there is no cover
#               url    a Spotify / Apple Music / YouTube link (default: a Spotify search)
#               note   one line
#               pick   true for the song of the year, shown large on a record sleeve
#   shows     title; optional: detail ("Season 2 · Apple TV+"), note, url,
#             poster (a 2:3 image under assets/img/favorites/<year>/), tone (a hue),
#             pick: true (the show of the year, listed first)
#
# Covers are the official artwork (Apple's catalogue via the iTunes Search API;
# She's the Best via Deezer). Agnes Kong is listed on Apple as 江語 / Jiang Yu.
# Show posters and networks come from TVmaze (api.tvmaze.com), cropped to 2:3.

# epigraph: a few lyric lines above the years; the last one gets the
# highlighter, like the line that is playing in a lyrics view.
epigraph:
  lines:
    - We'll move to India forever
    - Passed down like folk songs
    - Our love lasts so long
  song: seven
  artist: Taylor Swift
  album: folklore

# genres: the donut at the top of each year counts songs by their `genre` key.
# Listed in a fixed order, so a genre keeps its colour from year to year
# (light / dark steps checked with the dataviz palette validator: lightness,
# chroma, colour-blind separation). Classified from the Apple Music genre tags
# plus press descriptions: 54 Ultra = retro soul / '60s pop; Holly Humberstone,
# Ashe, 江語 and Melanie Martinez (HADES) = indie / alternative pop; Tinashe
# and SAILORR = R&B; Troye Sivan's She's the Best and ADÉLA's PRIMA = dance-pop
# / electropop; Olivia Rodrigo and Absolutely = pop; Drake = hip-hop.
genres:
  - key: indie
    name: Indie & Alt-pop
    color: "#2f6db5"
    dark: "#4f8bd4"
  - key: soul
    name: Retro Soul & ’60s Pop
    color: "#e0523f"
    dark: "#e5604c"
  - key: rnb
    name: R&B
    color: "#7d6fd6"
    dark: "#8c80e0"
  - key: dance
    name: Dance & Electropop
    color: "#0f9a8f"
    dark: "#1aa497"
  - key: pop
    name: Pop
    color: "#c98a1c"
    dark: "#b98219"
  - key: hiphop
    name: Hip-Hop
    color: "#c2457f"
    dark: "#d0568f"

